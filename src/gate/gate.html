<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindfulTab Reflection</title>
    <link rel="stylesheet" href="../shared/timer-wheel.css" />
    <link rel="stylesheet" href="../shared/intent-feedback.css" />
    <style>
      :root {
        --bg: #f1eff4;
        --text: #1d1d25;
        --muted: #666677;
        --btn: #58609f;
        --btn-text: #ffffff;
        --accent-soft: #c9cbe9;
        --card: #f4f2f8;
        --accent-strong: #58609f;
        --input-border: #8c8ba0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .panel {
        width: min(660px, 100%);
        background: #e9e7ef;
        border-radius: 16px;
        padding: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      .intro {
        margin: 0 0 14px;
        color: var(--muted);
      }

      .pill {
        display: inline-block;
        margin-bottom: 16px;
        background: #c9cbe9;
        color: #1c235a;
        border-radius: 999px;
        padding: 6px 12px;
        font-weight: 700;
      }

      #reflection-input {
        width: 100%;
        min-height: 90px;
        border: 1px solid #8c8ba0;
        border-radius: 12px;
        padding: 12px;
        font: inherit;
        resize: vertical;
      }

      .timer-required {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid #8c8ba0;
        border-radius: 12px;
        background: #f4f2f8;
      }

      .timer-required.hidden {
        display: none;
      }

      .timer-required label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .timer-required .timer-wheel-shell {
        width: 100%;
        margin-bottom: 0;
      }

      .gate-auth-hint {
        margin: 12px 0 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.35;
        color: #2c3166;
      }

      .gate-auth-hint.hidden {
        display: none;
      }

      .actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-end;
      }

      #continue-btn {
        border: 0;
        border-radius: 10px;
        background: var(--btn);
        color: var(--btn-text);
        font-size: 16px;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>Pause for a breath</h1>
      <p class="intro">This domain has low karma right now. You can continue anyway after a quick reflection.</p>
      <div id="domain-pill" class="pill"></div>
      <textarea id="reflection-input" maxlength="240" placeholder="What are you trying to do right now? (optional)"></textarea>

      <div id="ai-intent-panel" class="ai-intent-panel hidden" role="region" aria-label="AI intent feedback" aria-live="polite">
        <p id="ai-intent-message" class="ai-intent-message"></p>
        <div id="ai-intent-reply-block" class="ai-intent-reply-block">
          <label id="ai-intent-reply-label" class="ai-intent-reply-label" for="ai-intent-reply-input">Your reply</label>
          <input
            id="ai-intent-reply-input"
            class="ai-intent-reply-input"
            type="text"
            maxlength="160"
            placeholder="Respond or revise your intent…"
            autocomplete="off"
          />
        </div>
        <div id="ai-intent-confirm-actions" class="ai-intent-confirm-actions hidden">
          <button type="button" id="ai-intent-proceed" class="ai-intent-btn secondary">Start anyway</button>
          <button type="button" id="ai-intent-dismiss" class="ai-intent-btn">Change duration or reason</button>
        </div>
        <div id="ai-intent-notice-actions" class="ai-intent-notice-actions hidden">
          <button type="button" id="ai-intent-notice-dismiss" class="ai-intent-btn">Dismiss</button>
        </div>
      </div>

      <section id="timer-required" class="timer-required hidden">
        <label for="timer-minutes-wheel">Set a timer to continue</label>
        <div class="timer-wheel-shell">
          <div id="timer-minutes-wheel" class="timer-wheel" role="listbox" aria-label="Choose duration in minutes"></div>
          <div class="timer-wheel-highlight"></div>
        </div>
      </section>
      <p id="gate-auth-hint" class="gate-auth-hint hidden" aria-live="polite"></p>
      <div class="actions">
        <button id="continue-btn" type="button">Continue anyway</button>
      </div>
    </main>
    <script src="../shared/timer-wheel.js"></script>
    <script src="../shared/intent-feedback-ui.js"></script>
    <script src="./gate.js"></script>
  </body>
</html>
