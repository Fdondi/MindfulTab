<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindfulTab</title>
    <link rel="stylesheet" href="../shared/timer-wheel.css" />
    <link rel="stylesheet" href="../shared/intent-feedback.css" />
    <link rel="stylesheet" href="./newtab.css" />
    <link rel="stylesheet" href="../../fidget-app/cube.css" />
  </head>
  <body>
    <main class="screen">
      <section id="timer-view" class="card">
        <div class="work-promise-area" aria-label="Work-only path for this tab">
          <button id="work-promise-btn" class="work-promise-btn" type="button">
            <span class="work-promise-icon" aria-hidden="true">&#10003;&#129310;</span>
            <span class="work-promise-title">This is for work, I swear</span>
            <span class="work-promise-subtitle">Pomodoro mode for this tab</span>
          </button>
          <p id="work-promise-feedback" class="work-promise-feedback" aria-live="polite"></p>
        </div>
        <div class="timer-controls">
          <div class="top-actions">
            <button id="newtab-google-auth-btn" type="button" class="open-settings-btn">Sign in with Google</button>
            <button id="open-ai-settings-btn" type="button" class="open-settings-btn">AI settings</button>
            <button id="open-settings-btn" type="button" class="open-settings-btn">Karma settings</button>
            <button id="open-logs-btn" type="button" class="open-settings-btn">See logs</button>
            <span id="ext-version" class="ext-version" aria-label="Extension version"></span>
          </div>
          <h1 id="title-text" class="title">How long do you want<br />to use your browser?</h1>
          <p id="last-session-summary" class="last-session-summary hidden"></p>

          <div class="timer-wheel-shell">
            <div id="duration-wheel" class="timer-wheel" role="listbox" aria-label="Choose duration in minutes">
              <!-- Wheel options are generated by script -->
            </div>
            <div class="timer-wheel-highlight"></div>
          </div>

          <label id="reason-label" class="reason-label" for="reason-input">Why are you opening tabs? (optional)</label>
          <input
            id="reason-input"
            class="reason-input"
            type="text"
            maxlength="160"
            placeholder="Why are you opening tabs? (optional)"
          />

          <div id="ai-intent-panel" class="ai-intent-panel hidden" role="region" aria-label="AI intent feedback" aria-live="polite">
            <p id="ai-intent-message" class="ai-intent-message"></p>
            <div id="ai-intent-reply-block" class="ai-intent-reply-block">
              <label id="ai-intent-reply-label" class="ai-intent-reply-label" for="ai-intent-reply-input">Your reply</label>
              <input
                id="ai-intent-reply-input"
                class="ai-intent-reply-input"
                type="text"
                maxlength="160"
                placeholder="Respond or revise your intent…"
                autocomplete="off"
              />
            </div>
            <div id="ai-intent-confirm-actions" class="ai-intent-confirm-actions hidden">
              <button type="button" id="ai-intent-proceed" class="ai-intent-btn secondary">Start anyway</button>
              <button type="button" id="ai-intent-dismiss" class="ai-intent-btn">Change duration or reason</button>
            </div>
            <div id="ai-intent-notice-actions" class="ai-intent-notice-actions hidden">
              <button type="button" id="ai-intent-notice-dismiss" class="ai-intent-btn">Dismiss</button>
            </div>
          </div>

          <button id="start-btn" class="start-btn" type="button">Start</button>

          <p id="status-text" class="status-text" aria-live="polite"></p>
        </div>

        <div class="fidget-area" id="fidget-area">
          <canvas id="fireworks-canvas" class="fireworks-canvas"></canvas>
          <div id="fidget-cube-wrapper" class="fidget-cube-wrapper"></div>
          <p class="fidget-hint" id="fidget-hint"></p>
          <p class="fidget-clicks" id="fidget-clicks"></p>
        </div>
      </section>


      <section id="quick-launch" class="quick-launch">
        <h2 class="quick-launch-title">Quick Launch</h2>
        <ul id="quick-launch-list" class="quick-launch-list"></ul>
      </section>
</main>

    <script src="../shared/storage.js"></script>
    <script src="../shared/google-oauth.js"></script>
    <script src="../shared/intent-feedback-ui.js"></script>
    <script src="../shared/karma.js"></script>
    <script src="../shared/timer-wheel.js"></script>
    <script src="../search/embeddings.js"></script>
    <script src="../search/index.js"></script>
    <script src="../../fidget-app/cube.js"></script>
    <script src="./newtab.js"></script>
  </body>
</html>
